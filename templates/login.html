<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود به پنل مدیریت RVG Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <div class="max-w-md w-full p-8 rounded-3xl bg-slate-900/80 border border-slate-800 shadow-2xl backdrop-blur-xl relative overflow-hidden">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center font-bold text-2xl text-white shadow-xl shadow-emerald-500/20 mx-auto mb-4">
        ⚡
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">ورود به پنل RVG Gateway</h1>
      <p class="text-xs text-slate-400 mt-2">سیستم خود-میزبانی مدیریت پروکسی چندپروتکلی VLESS و SOCKS5</p>
    </div>

    {% if error %}
    <div class="mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs text-center font-medium">
      {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">نام کاربری ادمین</label>
        <input type="text" name="username" required autocomplete="username" placeholder="admin"
               class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">رمز عبور</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"
               class="w-full bg-slate-950 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition">
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/25 text-sm">
          ورود به سیستم
        </button>
      </div>
    </form>

    <div class="mt-8 text-center text-xs text-slate-500">
      نام کاربری و رمز پیش‌فرض: <span class="font-mono text-slate-400">admin / admin123</span> (قابل تغییر در ENV)
    </div>
  </div>

</body>
</html>
